# Push a tag like v3.0.2 to make a release:
#
# 1. The npm packages are submitted to npm's staging area through trusted
#    publishing, so no token is stored anywhere. Nothing goes live yet.
# 2. A GitHub release is created with notes from that version's section in
#    CHANGELOG.md and a sample report attached.
#
# Then approve the staged packages on npmjs.com (Staged Packages) or with
# `npm stage approve <id>`, in the order @tsight/core, @tsight/api, tsight.
# Approval needs your two-factor code, so a release cannot reach users without you.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # lets npm confirm the packages were built by this workflow

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Staged publishing needs npm 11.15.0 or later.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Check the tag matches the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          actual=$(node -p "require('./packages/cli/package.json').version")
          if [ "$version" != "$actual" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $actual in packages/cli/package.json"
            exit 1
          fi

      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: Submit to npm for approval
        run: |
          version="${GITHUB_REF_NAME#v}"
          # A version that is already on npm is skipped, so the job can be re-run.
          for dir in core api cli; do
            pkg=$(node -p "require('./packages/$dir/package.json').name")
            if npm view "$pkg@$version" version >/dev/null 2>&1; then
              echo "$pkg@$version is already on npm"
            else
              (cd "packages/$dir" && npm stage publish)
              echo "::notice::$pkg@$version is staged. Approve it on npmjs.com under Staged Packages."
            fi
          done

      - name: Sample report of TSight itself
        run: node packages/cli/dist/cli.js report . --out "tsight-report-${GITHUB_REF_NAME}.html"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "TSight ${GITHUB_REF_NAME#v}" --notes-file notes.md "tsight-report-${GITHUB_REF_NAME}.html"
