# Push a tag like v3.0.1 to publish a release: the npm packages (through npm's
# trusted publishing, so no token is stored anywhere) and a GitHub release with
# notes from that version's section in CHANGELOG.md and a sample report attached.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # lets npm confirm the packages were built by this workflow

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Check the tag matches the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          actual=$(node -p "require('./packages/cli/package.json').version")
          if [ "$version" != "$actual" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $actual in packages/cli/package.json"
            exit 1
          fi

      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: Publish to npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          # In dependency order. A version that is already on npm is skipped, so the job can be re-run.
          for pkg in @tsight/core @tsight/api tsight; do
            if npm view "$pkg@$version" version >/dev/null 2>&1; then
              echo "$pkg@$version is already on npm"
            else
              npm publish -w "$pkg"
            fi
          done

      - name: Sample report of TSight itself
        run: node packages/cli/dist/cli.js report . --out "tsight-report-${GITHUB_REF_NAME}.html"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "TSight ${GITHUB_REF_NAME#v}" --notes-file notes.md "tsight-report-${GITHUB_REF_NAME}.html"
