# Run TSight with Docker Compose.
#
# 1. Change the volume below to the folder that holds your code.
# 2. Run: docker compose up
# 3. Open http://localhost:3000 and enter a path under /code, for example /code/my-project

services:
  tsight:
    build: .
    ports:
      - "3000:3000"
    volumes:
      # Change this to your code folder.
      # Windows:   - "C:/Projects:/code"
      # Mac/Linux: - "/home/me/projects:/code"
      - "./:/code"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - TSIGHT_WORKSPACE_ROOT=/code
